<!DOCTYPE html>
<html>
<head>
  <!--
    Si publicas la app dentro de una subcarpeta, cambia la ruta base de abajo.

    La ruta debe comenzar y terminar con una diagonal "/".

    Más información:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    Flutter reemplaza esta ruta al compilar con la opción `--base-href`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cuidado digital para nuestros mayores.">

  <!-- Ajustes e íconos para iOS. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="velia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Ícono de la pestaña del navegador. -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>velia</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Puedes personalizar el inicio de Flutter o mostrar un aviso de carga.

    Más información:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
